name: Publish PDF Max release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.2.5"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode and validate private upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2; exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" >&2; exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" >&2; exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" >&2; exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-upload.jks
          test -s app/release-upload.jks
          keytool -list -keystore app/release-upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed APK and App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle testDebugUnitTest assembleRelease bundleRelease

      - name: Verify signed release packages and report sizes
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          test -n "$AAB_PATH" && test -s "$AAB_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH")"
          printf '%s\\n' "$BADGING" | grep -F "package: name='com.nexauren.pdfmax' versionCode='10' versionName='1.2.5'"
          printf '%s\\n' "$BADGING" | grep -F "sdkVersion:'26'"
          printf '%s\\n' "$BADGING" | grep -F "targetSdkVersion:'36'"
          jarsigner -verify -verbose -certs "$AAB_PATH" >/dev/null
          echo "Verified APK identity/version and AAB signature: $APK_PATH / $AAB_PATH"
          echo "Verified AAB: $AAB_PATH"
          du -h "$APK_PATH" "$AAB_PATH"
          cp "$APK_PATH" app-release-verified.apk
          cp "$AAB_PATH" app-release-verified.aab
          echo "Google Play will generate device-specific APK splits from the AAB."
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "PDF Max ${{ github.event.inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          prerelease: false
          files: |
            app-release-verified.apk
            app-release-verified.aab
          body: |
            PDF Max signed release APK and Android App Bundle. Google Play will generate device-specific APK splits from the AAB.
            The package is built with the private upload keystore, targets Android 16 (API 36), and uses R8/resource shrinking.
            Google Play should receive the AAB; the direct APK is universal while the Play-delivered install is device-optimized.
            Google Play App Signing and the required All files access declaration remain subject to Play Console setup and review.
